<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Source of images/brand/og-card.png, the 1200 x 630 link preview. Rendered by design/render-icons.cjs. -->
  <title>Chicky link preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=block" rel="stylesheet">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden; position: relative;
      background: #fff4dd; color: #103f40; font-family: Nunito, sans-serif;
    }
    .sun { position: absolute; left: 40px; top: 45px; width: 540px; height: 540px; border-radius: 50%; background: #ffe7a1; }
    .chicky { position: absolute; left: 50px; top: 50px; width: 520px; height: 520px; }
    .words { position: absolute; left: 600px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 28px; }
    .wordmark { width: 520px; height: auto; display: block; margin-left: -12px; }
    .pill { height: 54px; width: auto; display: block; }
    p { margin: 0; font-size: 36px; line-height: 1.3; font-weight: 700; }
  </style>
</head>
<body>
  <div class="sun"></div>
  <img class="chicky" src="../images/brand/chicky/three-quarter.webp" alt="" width="520" height="520">
  <div class="words">
    <img class="wordmark" src="../images/brand/wordmark.svg" alt="Chicky">
    <img class="pill" src="../images/brand/huat-pill.svg" alt="Huat tomorrow">
    <p>Record sales by voice and plan tomorrow’s portions.</p>
  </div>
</body>
</html>
