<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="174" viewBox="0 0 1200 174" role="img" aria-labelledby="title desc"><title id="title">One shift. Four simple steps.</title><desc id="desc">Tell Uncle your sales; review, edit and confirm; forecast tomorrow's demand; turn portions into an ingredient prep list.</desc><rect width="1200" height="174" rx="24" fill="#103F40"/><g font-family="Arial, sans-serif"><text x="30" y="45" fill="#FFC629" font-size="16" font-weight="700">01</text><text x="30" y="87" fill="#FFFDF5" font-size="27" font-weight="700">Tell Uncle</text><text x="30" y="122" fill="#E0EAE1" font-size="16">Speak, type or import sales.</text><path d="M29034v103" stroke="#FFFDF5" stroke-opacity=".18"/><text x="330" y="45" fill="#FFC629" font-size="16" font-weight="700">02</text><text x="330" y="87" fill="#FFFDF5" font-size="27" font-weight="700">Make it yours</text><text x="330" y="122" fill="#E0EAE1" font-size="16">Review, edit and confirm.</text><path d="M59034v103" stroke="#FFFDF5" stroke-opacity=".18"/><text x="630" y="45" fill="#FFC629" font-size="16" font-weight="700">03</text><text x="630" y="87" fill="#FFFDF5" font-size="27" font-weight="700">Look ahead</text><text x="630" y="122" fill="#E0EAE1" font-size="16">Forecast tomorrow’s demand.</text><path d="M89034v103" stroke="#FFFDF5" stroke-opacity=".18"/><text x="930" y="45" fill="#FFC629" font-size="16" font-weight="700">04</text><text x="930" y="87" fill="#FFFDF5" font-size="27" font-weight="700">Get ready</text><text x="930" y="122" fill="#E0EAE1" font-size="16">Turn portions into ingredients.</text></g></svg>